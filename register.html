<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document:</title>
</head>
<body>
    <form>
        <table>
            <tr><td>
                name:
            </td>
            <td>
                <input type="text"placeholder="name "name="" >
            </td>

            </tr>
            <tr>
                <td>
                    password:
                </td>
                <td>
                    <input type="password" placeholder="password" password="">
                </td>
            </tr>
            <tr>
                <td>
                    gender:
                </td>
                <td>
                    <input type="radio" name="gender" value="male">male
                    <input type="radio" name="gender" value="female">female
                </td>
            </tr>
            <tr>
                <td>
                    Email:
                </td>
                <td>
                    <input type="email" placeholder="email">
                </td>
            </tr>
            <tr>
                <td>phone number:</td>
                <td><select>
                    <option value="977">select</option>
                    <option value="988">india<option> 
                    <option value="999">usa</option>
                    <option value="966">uk</option>



                </select>
                    <input type="tel" placeholder="phone number">
                </td>
                
            </tr>
            <tr>
                <td> DOB:</td>
                <td>
                    <input type="date"placeholder="DOB">    </td>
            </tr>
            <tr>
                <td>hobbies</td>
                <td>
                    <input type="checkbox" singing>singing
                    <input type="checkbox"reading>reading
                    <input type="checkbox"gaming>gaming
                </td>
            </tr>
            <tr><td>
                Education Qualification:
            </td>
                <td>
                    <select>
                        <option>10</option>
                        <option>12</option>
                        <option>Graduation</option>
                        <option>post Graduation</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                Address:
                </td>
                <td>
                    <textarea row="4" col="4" placeholder="Address"  ></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit">
                </td>
            </tr>
        </table>
    </form>
    
</body>
</html>
